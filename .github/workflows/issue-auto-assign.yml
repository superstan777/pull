name: Issue Auto Assign

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  auto-assign:
    name: Auto Assign Copilot on New Issue
    runs-on: ubuntu-latest
    if: "!contains(github.event.issue.labels.*.name, 'draft')"
    steps:
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create copilot --repo ${{ github.repository }} --color 0075ca --description "Ready for Copilot" 2>/dev/null || true
          gh label create queued  --repo ${{ github.repository }} --color e4e669 --description "Waiting for current PR to merge" 2>/dev/null || true
          gh label create draft   --repo ${{ github.repository }} --color d93f0b --description "Being clarified — do not start" 2>/dev/null || true

      - name: Check for open PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PR=$(gh pr list \
            --repo ${{ github.repository }} \
            --state open \
            --json number \
            --jq 'length')
          echo "open_pr_count=$OPEN_PR" >> "$GITHUB_OUTPUT"

      - name: Queue if PR already open
        if: steps.check_pr.outputs.open_pr_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label queued
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "A PR is already open. This issue has been queued and will be picked up automatically after the current PR is merged."

      - name: Assign Copilot if no open PR
        if: steps.check_pr.outputs.open_pr_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label copilot
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "Issue is ready for Copilot. Use **Assign to Copilot** in GitHub UI to start."
