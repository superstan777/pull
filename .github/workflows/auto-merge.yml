name: Auto Merge

on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: write

jobs:
  debug:
    name: Log Review Event Values
    runs-on: ubuntu-latest
    steps:
      - name: Print event details
        run: |
          echo "Review state:    ${{ github.event.review.state }}"
          echo "Reviewer login:  ${{ github.event.review.user.login }}"
          echo "Branch:          ${{ github.event.pull_request.head.ref }}"

  merge:
    name: Merge When CI Green and Review Approved
    runs-on: ubuntu-latest
    if: >
      github.event.review.state == 'approved' &&
      (
        github.event.review.user.login == 'copilot[bot]' ||
        github.event.review.user.login == 'Copilot' ||
        github.event.review.user.login == 'github-copilot[bot]' ||
        github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
      )
    steps:
      - name: Wait for CI checks and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checks ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --watch \
            --fail-fast
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --auto
