name: Auto Merge

on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge When CI Green and Review Approved
    runs-on: ubuntu-latest
    if: >
      github.event.review.state == 'approved' &&
      (
        startsWith(github.event.pull_request.head.ref, 'copilot/') ||
        startsWith(github.event.pull_request.head.ref, 'Copilot/')
      ) &&
      (
        github.event.review.user.login == 'copilot[bot]' ||
        github.event.review.user.login == 'Copilot' ||
        github.event.review.user.login == 'github-copilot[bot]'
      )
    steps:
      - name: Wait for CI checks and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checks ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --watch \
            --fail-fast
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --auto
