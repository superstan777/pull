name: Queue Advance

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  promote:
    name: Promote Oldest Queued Issue
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'copilot/')
    steps:
      - name: Find oldest queued issue
        id: find_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --repo ${{ github.repository }} \
            --label queued \
            --state open \
            --sort created \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Promote queued issue to copilot
        if: steps.find_issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ steps.find_issue.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --remove-label queued \
            --add-label copilot
          gh issue comment ${{ steps.find_issue.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "Previous PR merged. Copilot has been assigned to this issue."
