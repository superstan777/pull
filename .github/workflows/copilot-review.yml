name: Copilot Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    name: Request Copilot Review
    runs-on: ubuntu-latest
    if: |
      startsWith(github.head_ref, 'copilot/') ||
      startsWith(github.head_ref, 'Copilot/')
    steps:
      - name: Request review from Copilot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --add-reviewer copilot || true
          echo "Review request sent (or already exists)"
