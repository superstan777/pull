name: Issue Webhook

on:
  issues:
    types:
      - opened
      - closed

permissions: {}

jobs:
  notify-bot:
    name: Notify VPS Bot
    runs-on: ubuntu-latest
    steps:
      - name: POST to bot
        env:
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
        run: |
          curl -sf -X POST "${BOT_WEBHOOK_URL}/issue" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${BOT_WEBHOOK_SECRET}" \
            -d '{"action":"${{ github.event.action }}","issue_number":${{ github.event.issue.number }},"repo":"${{ github.repository }}"}'
