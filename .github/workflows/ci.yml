name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - edited
      - ready_for_review

concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # On edited: only run when [WIP] has been removed from title (Copilot signals done)
    # On ready_for_review: always run (manual fallback)
    if: >
      github.event.action == 'ready_for_review' ||
      (
        github.event.action == 'edited' &&
        !startsWith(github.event.pull_request.title, '[WIP]')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

  docs-check:
    name: Docs Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check .md coverage
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          # All changed .tsx/.ts files (excluding ui/, tests, node_modules)
          # || true prevents grep returning exit 1 (no matches) from killing the
          # script under bash -e when a PR touches no .ts/.tsx files at all.
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -E '\.(tsx|ts)$' \
            | grep -v 'components/ui/' \
            | grep -v '/index\.ts' \
            | grep -v '\.test\.' \
            | grep -v '\.spec\.' \
            | grep -v 'node_modules/' || true)

          # components/, hooks/, app/, lib/ require .md — types/ is exempt (pure type defs)
          NEED_DOCS=$(echo "$CHANGED" | grep -E '^(components|hooks|app|lib)/' | grep -v 'components/ui/' || true)

          MISSING=""
          for f in $NEED_DOCS; do
            md="${f%.*}.md"
            if ! git diff --name-only "$BASE" "$HEAD" | grep -qF "$md"; then
              MISSING="$MISSING\n  $f → missing updated $md"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Missing .md updates for changed files:"
            printf "$MISSING"
            exit 1
          fi

          echo "✓ All changed files have updated .md files"
